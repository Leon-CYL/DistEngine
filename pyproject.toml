[project]
name = "distengine"
version = "0.1.0"
description = "A minimal inference engine exploring disaggregated prefill and decode with work stealing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1.33.0",
    "ray>=2.59.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[project.scripts]
distengine = "distengine:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distengine", "src/models", "src/layers"]

[tool.hatch.build.targets.wheel.force-include]
"src/generation.py" = "generation.py"
"src/load_model.py" = "load_model.py"
"src/hf_reference.py" = "hf_reference.py"
"src/manual_generate.py" = "manual_generate.py"
"src/verify.py" = "verify.py"
"src/verify_cache.py" = "verify_cache.py"
"src/verify_blocks.py" = "verify_blocks.py"
"src/verify_runner.py" = "verify_runner.py"
"src/verify_scheduler.py" = "verify_scheduler.py"
"src/verify_engine.py" = "verify_engine.py"
"src/verify_workers.py" = "verify_workers.py"
"src/verify_ray_workers.py" = "verify_ray_workers.py"
"src/verify_gpu_workers.py" = "verify_gpu_workers.py"
"src/verify_transfer.py" = "verify_transfer.py"
